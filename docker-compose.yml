services:
  postgres:
    image: postgres:16-alpine
    container_name: bloomani-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: bloomani
      POSTGRES_PASSWORD: bloomani
      POSTGRES_DB: bloomani
    volumes:
      - bloomani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bloomani -d bloomani']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bloomani_pgdata:
